name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  dependency-audit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.txt --disable-pip --progress-spinner off -f json -o dependency-audit.json
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ matrix.os }}
          path: dependency-audit.json

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check
      - name: Lint
        run: python -m ruff check app tests scripts
      - name: Validate bilingual interface
        run: |
          node --check app/static/app.js
          node --check app/static/i18n.js
          node tests/test_i18n.js
          node tests/test_queue.js
          node tests/test_handoff.js
          node tests/test_frontend_boot.js
          node tests/test_emergency.js
          node tests/test_assignment_policy.js
          node tests/test_logout.js
          node tests/test_status_concurrency.js
      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Test PostgreSQL backend
        env:
          DATABASE_URL: postgresql://helpdesk:test_password@127.0.0.1:5432/helpdesk_test
          DEMO_MODE: "true"
        run: python -m pytest tests/test_postgres.py -q
      - name: Evaluate RAG retrieval baseline
        run: python -m scripts.evaluate_rag
      - name: Build Docker image
        run: docker build -t helpdesk-rag:${{ github.sha }} .
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
