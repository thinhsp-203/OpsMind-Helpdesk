services:
  - type: web
    name: opsmind-helpdesk
    env: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: "admin"
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: TOKEN_EXPIRE_MINUTES
        value: "120"
